services:
  postgres:
    image: postgres:16
    container_name: loanlens-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: loanlens
      POSTGRES_DB: loanlens
    ports:
      - "5432:5432"
    volumes:
      - loanlens_pg_data:/var/lib/postgresql/data

volumes:
  loanlens_pg_data: